services:
  mysql:
    image: ${IMAGE_REGISTRY:-localhost}/tools-project-mysql:${IMAGE_TAG:-latest}
    build:
      context: ./database
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/tools_mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tools}
      MYSQL_USER: ${MYSQL_USER:-tools_app}
      MYSQL_PASSWORD_FILE: /run/secrets/tools_mysql_password
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - tools_mysql_root_password
      - tools_mysql_password

  backend:
    image: localhost/tools-project-backend:latest
    build:
      context: ./backend
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${MYSQL_DATABASE:-tools}
      DATABASE_USER: ${MYSQL_USER:-tools_app}
      DATABASE_PASSWORD_FILE: /run/secrets/tools_mysql_password
      PORT: "8082"
      GIN_MODE: release
      JWT_SECRET_FILE: /run/secrets/tools_jwt_secret
      FRONTEND_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8082"
    secrets:
      - tools_mysql_password
      - tools_jwt_secret

  frontend:
    image: localhost/tools-project-frontend:latest
    build:
      context: ./frontend
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"

volumes:
  mysql_data:
    # Preserve the volume name used by the previous backend/compose.yaml.
    name: ${MYSQL_VOLUME_NAME:-backend_mysql_data}

secrets:
  tools_mysql_root_password:
    external: true
  tools_mysql_password:
    external: true
  tools_jwt_secret:
    external: true
