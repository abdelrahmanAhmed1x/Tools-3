# Shared connection string, using the internal MySQL service hostname.
x-database-url: &database-url "${MYSQL_USER:?Set MYSQL_USER}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:?Set MYSQL_DATABASE}?parseTime=true"

services:
  mysql:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    # Optional CLI for inspecting or managing migrations manually.
    # Normal startup applies migrations inside the backend container.
    profiles: ["tools"]
    image: localhost/tools-project-goose:latest
    build:
      context: ./backend
      dockerfile: Containerfile.goose
    restart: "no"
    environment:
      GOOSE_DRIVER: mysql
      GOOSE_DBSTRING: *database-url
      GOOSE_MIGRATION_DIR: /app/migrations
    command: ["up"]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    image: localhost/tools-project-backend:latest
    build:
      context: ./backend
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      PORT: "8082"
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes}
      FRONTEND_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8082"
    # Podman drops Containerfile HEALTHCHECK instructions in OCI images.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: localhost/tools-project-frontend:latest
    build:
      context: ./frontend
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    # Preserve the volume name used by the previous backend/compose.yaml.
    name: ${MYSQL_VOLUME_NAME:-backend_mysql_data}
