version: "2"

sql:
  - name: "orders"
    engine: "mysql"

    schema: "../../../migrations"
    queries:
      - "queries/orders.sql"
      - "../../courier/internal/queries/courier.sql"
      - "../../Auth/internal/queries/auth.sql"

    strict_function_checks: true
    strict_order_by: true

    gen:
      go:
        package: "sqlc"
        out: "sqlc"
        sql_package: "database/sql"

        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
        emit_json_tags: false
